name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. Re-enabling through the API keeps `poll` running without committing anything.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/poll.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
